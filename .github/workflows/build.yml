name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q PtichyaBurmalda.zip
      - name: Fix duplicate Kotlin classes
        working-directory: PtichyaBurmalda
        run: |
          sed -i "s|implementation 'androidx.webkit:webkit:1.11.0'|implementation 'androidx.webkit:webkit:1.11.0'\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')|" app/build.gradle
          cat app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --stacktrace
        working-directory: PtichyaBurmalda
      - uses: actions/upload-artifact@v4
        with:
          name: PtichyaBurmalda-debug-apk
          path: PtichyaBurmalda/app/build/outputs/apk/debug/app-debug.apk
