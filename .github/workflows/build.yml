name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          if [ -f PtichyaBurmalda.zip ]; then unzip -q -o PtichyaBurmalda.zip; fi
          SG=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$SG" ]; then echo "::error::settings.gradle not found: upload PtichyaBurmalda.zip to the repository root"; exit 1; fi
          echo "APP_DIR=$(dirname "$SG")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: ${{ env.APP_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: PtichyaBurmalda-debug-apk
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/app-debug.apk
