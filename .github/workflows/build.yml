name: Сборка Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Найти проект
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1)
          if [ -n "$ZIP" ]; then
            echo "Распаковываю $ZIP"
            unzip -q -o "$ZIP" -d unpacked
          fi
          SG=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$SG" ]; then
            echo "::error::settings.gradle не найден. Загрузите PtichyaBurmalda.zip или содержимое проекта в корень репозитория"
            exit 1
          fi
          echo "APP_DIR=$(dirname "$SG")" >> "$GITHUB_ENV"
          echo "Проект: $(dirname "$SG")"

      - name: Исправить конфликт версий Kotlin
        working-directory: ${{ env.APP_DIR }}
        run: |
          if ! grep -q kotlin-bom app/build.gradle; then
            sed -i "s|^dependencies {|dependencies {\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')|" app/build.gradle
          fi
          cat app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Собрать APK
        working-directory: ${{ env.APP_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PtichyaBurmalda-debug-apk
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/app-debug.apk
